<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7ed">
  <title>ことばクエスト | タイピングぼうけん</title>
  <link rel="stylesheet" href="style.css">
  <style>
    [hidden] { display: none !important; }
    .keyboard-guide { flex-direction: column; align-items: center; gap: 4px; }
    .keyboard-row { display: flex; gap: 5px; }
    .keyboard-row:nth-child(2) { padding-left: 12px; }
    .keyboard-row:nth-child(3) { padding-left: 24px; }
    .keycap { flex: 0 0 30px; }
    @media (max-width: 390px) { .keycap { flex-basis: 27px; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="ことばクエスト ホーム"><span class="brand-mark">K</span><span>ことばクエスト</span></a>
      <div class="top-status"><span class="save-state"><span class="save-dot"></span>ぼうけんを保存中</span><button class="icon-button" id="reset-button" type="button" title="ぼうけんをリセット" aria-label="ぼうけんをリセット"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 4v5m4-5v5"/></svg></button></div>
    </header>
    <main class="layout">
      <section class="game-column" aria-label="タイピングぼうけん">
        <div class="journey-bar"><div><span class="eyebrow">きょうのぼうけん</span><h1>ことばで たたかえ！</h1></div><div class="level-chip"><span>✦</span><span id="level-label">レベル 1</span></div></div>
        <section class="battle-scene" aria-label="バトル">
          <div class="scene-sun"></div><div class="scene-cloud cloud-one"></div><div class="scene-cloud cloud-two"></div><div class="scene-ground"></div>
          <div class="battle-topline"><span class="stage-label"><span class="stage-dot"></span><span id="stage-label">みどりの草原</span></span><span class="timer-pill" id="timer-pill" hidden><span>◷</span><span id="timer-label">32</span></span></div>
          <div class="battlefield">
            <div class="enemy-side"><div class="enemy-info"><span class="enemy-name" id="enemy-name">もこもこウルフ</span><span class="enemy-level" id="enemy-level">Lv. 1</span></div><div class="health-track"><span id="enemy-health"></span></div><div class="monster-wrap" id="monster-wrap"><div class="monster-shadow"></div><div class="monster-art" id="monster-art"></div></div></div>
            <div class="battle-effects" id="battle-effects" aria-live="polite"></div>
            <div class="hero-side"><div class="hero-avatar" aria-hidden="true"><span class="hero-helmet"></span><span class="hero-face">☺</span><span class="hero-cape"></span></div><div class="hero-caption"><span class="hero-name">ぼうけんしゃ</span><span class="hero-level" id="hero-level">Lv. 1</span></div></div>
          </div>
          <p class="battle-message" id="battle-message" aria-live="polite">ことばを うって こうげきしよう！</p>
        </section>
        <section class="typing-panel" aria-labelledby="typing-heading">
          <div class="typing-heading-row"><div><span class="eyebrow" id="category-label">どうぶつ</span><h2 id="typing-heading">このことばを うとう</h2></div><div class="word-count"><span id="word-number">1</span><span>/</span><span id="words-total">3</span><span>ことば</span></div></div>
          <div class="word-display" aria-live="polite"><span class="word-kana" id="word-kana">ねこ</span><span class="word-roman" id="word-roman">neko</span></div>
          <label class="sr-only" for="typing-input">ローマ字でことばを入力</label>
          <div class="input-row" id="input-row"><span class="input-prefix">Aa</span><input id="typing-input" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここにローマ字を入力" aria-describedby="typing-feedback"><span class="input-feedback" id="typing-feedback" aria-live="polite">Enterキーでも こうげき！</span></div>
          <div class="keyboard-guide" id="keyboard-guide" aria-label="キーボードのヒント"></div>
        </section>
        <section class="progress-section" aria-label="レベルアップまで"><div class="progress-copy"><span>つぎのレベルまで</span><strong id="xp-label">0 / 100 XP</strong></div><div class="progress-track"><span id="xp-bar"></span></div></section>
      </section>
      <aside class="side-column" aria-label="ぼうけんのじょうほう">
        <section class="side-panel collection-panel"><div class="panel-heading"><div><span class="eyebrow">なかま</span><h2>モンスターずかん</h2></div><span class="collection-count" id="collection-count">0</span></div><div class="collection-list" id="collection-list"></div><p class="empty-note" id="empty-note">モンスターを たおして<br>なかまにしよう！</p></section>
        <section class="side-panel adventure-panel"><div class="panel-heading"><div><span class="eyebrow">ぼうけんのきろく</span><h2>きょうのきろく</h2></div><span class="record-mark">✦</span></div><div class="record-list"><div class="record-row"><span class="record-icon">Aa</span><span>うったことば</span><strong id="words-typed">0</strong></div><div class="record-row"><span class="record-icon record-star">★</span><span>せいかい</span><strong id="correct-count">0</strong></div><div class="record-row"><span class="record-icon record-monster">●</span><span>なかま</span><strong id="record-monsters">0</strong></div></div></section>
        <div class="gentle-note"><span>✦</span><p>まちがえても だいじょうぶ。<br>ヒントをみて もういちど！</p></div>
      </aside>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
